{% extends 'printoapp/layout.html' %}
{% load static %}

{% block title %}Select Shop | MyPrints{% endblock %}

{% block body %}

{% block extra_head %}
<script>
    // Django will render this into a real path like "/static/printoapp/bin.png"
    const PIN_ICON = "{% static 'printoapp/pin.jpg' %}";
</script>
<link href="{% static 'printoapp/shops.css' %}" rel="stylesheet">
{% endblock %}

<div class="sticky-header">
        <h3 class="mb-3 font-weight-bold" style="font-size: 2rem;">
            <span class="text-primary">MyPrints</span>
        </h3>
</div>

{{ shops_json|json_script:"shops-data" }}


<div class="shops-container">
    <form action="{% url 'shops' %}" method="POST" class="shops_form">
        {% csrf_token %}
        <input type="text" hidden id="user_id" name="user_id">
        <div id="shops-list">
            <p>Finding nearest shops...</p>
        </div>
    </form>
</div>
{% endblock %}
