{% extends 'printoapp/layout.html' %}
{% load static %}

{% block extra_head %}
<link href="{% static 'printoapp/shop_index.css' %}" rel="stylesheet">
{% block shop_extra_head %}{% endblock %}
{% endblock %}

{% block body %}
<div class="sd-root">

    <!-- ══════════════════════════════════
         TOP BAR
    ════════════════════════════════════ -->
    <header class="sd-topbar">
        <div class="sd-topbar-left">
            <button class="sd-hamburger" id="sdHamburger" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <a href="{% url 'creator_index' %}" class="sd-topbar-logo">My<em>Prints</em> <span>Creator</span></a>
        </div>
        <div class="sd-topbar-right">
            <a href="{% url 'creator_logout' %}" class="sd-logout-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"
                          stroke="currentColor" stroke-width="2.2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Logout
            </a>
        </div>
    </header>

    <div class="sd-body">

        <!-- ══════════════════════════════════
             SIDEBAR
        ════════════════════════════════════ -->
        <aside class="sd-sidebar" id="sdSidebar">
            <nav class="sd-nav">

                <a href="{% url 'creator_index' %}"
                   class="sd-nav-item {% block nav_queue %}{% endblock %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Dashboard overview
                </a>

                <a href="{% url 'creator_shop_view' %}"
                   class="sd-nav-item {% block nav_catalogue %}{% endblock %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Shop view
                </a>

                <a href="{% url 'creator_settings' %}"
                   class="sd-nav-item {% block nav_account %}{% endblock %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Settings
                </a>

            </nav>
        </aside>

        <!-- ══════════════════════════════════
             MAIN CONTENT (child pages fill this)
        ════════════════════════════════════ -->
        <main class="sd-main">
            {% block sd_content %}{% endblock %}
        </main>

    </div><!-- /.sd-body -->
</div><!-- /.sd-root -->

<script>
    // hamburger toggle
    document.getElementById('sdHamburger').addEventListener('click', function () {
        document.getElementById('sdSidebar').classList.toggle('sd-sidebar--open');
    });
    // close sidebar on outside click (mobile)
    document.addEventListener('click', function (e) {
        const sidebar   = document.getElementById('sdSidebar');
        const hamburger = document.getElementById('sdHamburger');
        if (sidebar.classList.contains('sd-sidebar--open') &&
            !sidebar.contains(e.target) &&
            !hamburger.contains(e.target)) {
            sidebar.classList.remove('sd-sidebar--open');
        }
    });
</script>
{% endblock %}
